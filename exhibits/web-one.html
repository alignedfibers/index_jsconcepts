const pages={"index.html": {"title": "Home", "html": "<body bgcolor=\"#000000\" onload=\"MM_preloadImages('images/proposal/navProposal.gif','images/proposal/navPageNotes.gif','images/proposal/navGeneralInfo.gif','images/proposal/navContactMe.gif','images/proposal/navMainPage.gif')\" text=\"#1e90ff\">\n<!-- -->\n<!-- -->\n<basefont size=\"2\"/>\n<div align=\"center\">\n<!--Header-->\n<h1 align=\"center\"><p>Class 152-101 Home/L3A1 Site Spec <\/p><\/h1>\n<!--EndHeader-->\n<center>\n<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"821\">\n<tr valign=\"Middle\">\n<td><img alt=\"NavBar Proposal\" border=\"0\" height=\"46\" id=\"navbar_home\" loading=\"lazy\" name=\"navbar_proposal\" src=\"../assets/web-one/images/proposal/navProposal_nu.GIF\" width=\"113\"/><\/td>\n<td><img alt=\"NavBar Page Notes\" border=\"0\" height=\"46\" id=\"navbar_ourvision\" loading=\"lazy\" name=\"navbar_pageNotes\" src=\"../assets/web-one/images/proposal/navPageNotes_nu.GIF\" width=\"198\"/><\/td>\n<td><img alt=\"NavBar General Info\" border=\"0\" height=\"46\" id=\"navbar_aboutus\" loading=\"lazy\" name=\"navbar_generalInfo\" src=\"../assets/web-one/images/proposal/navGeneralInfo_nu.GIF\" width=\"198\"/><\/td>\n<td><img alt=\"NavBar Contact Me\" border=\"0\" height=\"46\" id=\"navbar_artworktransfer\" loading=\"lazy\" name=\"navbar_contactMe\" src=\"../assets/web-one/images/proposal/navContactMe_nu.GIF\" width=\"183\"/><\/td>\n<td><img alt=\"NavBar Main Page\" border=\"0\" height=\"46\" id=\"navbar_contactus\" loading=\"lazy\" name=\"navbar_mainPage\" src=\"../assets/web-one/images/proposal/navMainPage_nu.GIF\" width=\"146\"/><\/td>\n<\/tr><\/table>\n<table border=\"0\" cellpadding=\"2\" cellspacing=\"2\" width=\"890\">\n<tr valign=\"Top\">\n<td align=\"Left\">\n<table border=\"0\" cellpadding=\"4\" cellspacing=\"4\" width=\"50%\">\n<tr valign=\"Center\">\n<td align=\"center\"><font face=\"Arial\" size=\"4\">\n<img alt=\"\" border=\"0\" height=\"426\" loading=\"lazy\" src=\"../assets/web-one/images/sideBars/me4.bmp\" width=\"208\"/>\n<\/font><\/td>\n<\/tr>\n<\/table>\n<td align=\"Center\">\n<table border=\"0\" cellpadding=\"4\" cellspacing=\"4\" width=\"100%\">\n<tr valign=\"Center\">\n<td align=\"Left\"><font face=\"Arial\" size=\"2\">\n<center><img alt=\"\" border=\"0\" height=\"34\" loading=\"lazy\" src=\"../assets/web-one/images/mainNav/mainNavT.bmp\" width=\"650\"/><\/center><br/>\n<center>Welcome to Shawn's Web Design and Development Page.<\/center>\n<center>In the following pages I will demonstrate, navigational structure,<\/center>\n<center>design layout, consistancy between pages &amp; basic CSS + jscript.<\/center><br/>\n<center>The audience this page is designed for is a programing  instructor,<\/center>\n<center>specificaly James Kiley. This site is only a demonstration. If I want<\/center>\n<center>to know more about programing instuctors I would ask the instructors<\/center>\n<center>I communicate with frequently.<\/center><br/>\n<center>The success of this site is based on the grade I recieve,<\/center>\n<center> thus my goal is also to aquire a great grade.<\/center>\n<p>\n<center>\r\nView Flow Chart For This Site<\/center><\/p>\n<p>\n<center>\r\nView Layout For This Site<\/center><\/p>\n<p>\n<center>\r\nDynamic Navigation Idea Explained<\/center><\/p>\n<p>\n<center>\r\nLinks To Pages Used As Resources<\/center><\/p>\n<p> <center><a class=\"linkBar\" href=\"#/page/index.html\">Home   <\/a>Assignments   Labs   \r\n\t<\/center><\/p>\n<p><center><span style=\"background-color: #000000\"><img alt=\"\" border=\"0\" height=\"34\" loading=\"lazy\" src=\"../assets/web-one/images/mainNav/mainNavB.bmp\" width=\"650\"/> <\/span><\/center>\n<\/p><\/font><\/td>\n<\/tr>\n<\/table>\n<!--<TD ALIGN=\"Right\">\r\n\t<TABLE BORDER=0 CELLPADDING=4 CELLSPACING=4 WIDTH=\"50%\">\r\n   \t<TR VALIGN=\"Center\"> \r\n\t<TD ALIGN=\"center\"><FONT SIZE=\"4\" FACE=\"Arial\">\r\n\t<img src=\"images/sideBars/sideBarR.bmp\"BORDER=0 WIDTH=\"148\" HEIGHT=\"300\" ALT=\"\"><\/A>\t\t\r\n\r\n\t<\/TD>\r\n\t<\/TR>\r\n\t<\/TABLE>-->\n<\/td>\n<\/td><\/tr>\n<\/table>\n<\/center><\/div><\/body>"}, "Assignments/proposal.html": {"title": "Proposal", "html": "<body bgcolor=\"#000000\" onload=\"MM_preloadImages('../images/proposal/navProposal.gif','../images/proposal/navPageNotes.gif','../images/proposal/navGeneralInfo.gif','../images/proposal/navContactMe.gif','../images/proposal/navMainPage.gif')\" text=\"#1e90ff\">\n<!-- -->\n<!-- -->\n<basefont size=\"2\"/>\n<div align=\"center\">\n<!--Header-->\n<h1 align=\"center\"><p>Children &amp; The Internet Proposal <\/p><\/h1>\n<!--EndHeader-->\n<center>\n<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"821\">\n<tr valign=\"Middle\">\n<td><a href=\"#/page/Assignments/proposal.html\"><img alt=\"NavBar Proposal\" border=\"0\" height=\"46\" id=\"navbar_home\" loading=\"lazy\" name=\"navbar_proposal\" src=\"../assets/web-one/images/proposal/navProposal_nu.GIF\" width=\"113\"/><\/a><\/td>\n<td><a href=\"#/page/Assignments/pageNotes.html\"><img alt=\"NavBar Page Notes\" border=\"0\" height=\"46\" id=\"navbar_ourvision\" loading=\"lazy\" name=\"navbar_pageNotes\" src=\"../assets/web-one/images/proposal/navPageNotes_nu.GIF\" width=\"198\"/><\/a><\/td>\n<td><img alt=\"NavBar General Info\" border=\"0\" height=\"46\" id=\"navbar_aboutus\" loading=\"lazy\" name=\"navbar_generalInfo\" src=\"../assets/web-one/images/proposal/navGeneralInfo_nu.GIF\" width=\"198\"/><\/td>\n<td><img alt=\"NavBar Contact Me\" border=\"0\" height=\"46\" id=\"navbar_artworktransfer\" loading=\"lazy\" name=\"navbar_contactMe\" src=\"../assets/web-one/images/proposal/navContactMe_nu.GIF\" width=\"183\"/><\/td>\n<td><img alt=\"NavBar Main Page\" border=\"0\" height=\"46\" id=\"navbar_contactus\" loading=\"lazy\" name=\"navbar_mainPage\" src=\"../assets/web-one/images/proposal/navMainPage_nu.GIF\" width=\"146\"/><\/td>\n<\/tr><\/table>\n<table border=\"0\" cellpadding=\"2\" cellspacing=\"2\" width=\"890\">\n<tr valign=\"Top\">\n<td align=\"Left\">\n<table border=\"0\" cellpadding=\"4\" cellspacing=\"4\" width=\"50%\">\n<tr valign=\"Center\">\n<td align=\"center\"><font face=\"Arial\" size=\"2\"><br/>\r\n\t\tThis proposal is for a site other than<br/>\r\n\t\tthis one. That I might like to create<br/>\n<img alt=\"\" border=\"0\" height=\"426\" loading=\"lazy\" src=\"../assets/web-one/images/sideBars/me4.bmp\" width=\"208\"/>\n<\/font><\/td>\n<\/tr>\n<\/table>\n<td align=\"Center\">\n<table border=\"0\" cellpadding=\"4\" cellspacing=\"4\" width=\"100%\">\n<tr valign=\"Center\">\n<td align=\"Left\"><font face=\"Arial\" size=\"2\">\n<center><img alt=\"\" border=\"0\" height=\"34\" loading=\"lazy\" src=\"../assets/web-one/images/mainNav/mainNavT.bmp\" width=\"650\"/><\/center><br/>\r\nTarget Audience: <br/>\r\n           &amp;nbspAny one with children or in direct relation with the learning and growth prowess of a child.<br/>\r\n           &amp;nbspThe site may be of use to schools, churches, children's summer camps, libraries or parents<br/>\n<p>Main Objective:<br/>\r\n\r\n           &amp;nbspInform and keep informed of barriers faced limitting what children view on line.<br/>\n<p>\r\n\r\n\r\nUser Assessment:<br/>\r\n           &amp;nbspI would track site hits with a view counter. I would also create an area for user feedback<br/>\r\n           &amp;nbspsubmissions<br/>\n<p>Ideas:<br/>\r\n\r\n           &amp;nbspProgram review \"page\".  Reviews of filtering programs.<br/>\r\n\r\n           &amp;nbspOverview \"page\" of the laws protecting minors on the internet.<br/>\r\n\r\n           &amp;nbspDevelopers help \"page\" on how not to be rejected by filters<br/>\r\n\r\n           &amp;nbspData on monkies digesting bad internet media may prove benificial. / NBC news clips<br/>\n<p>Limiting Factors:<br/>\r\n\r\n           &amp;nbspTesting of vast amounts of filtering programs may be overwhelming. <br/>\r\n           &amp;nbspEffort put forth may be better suited to two or more  individuals<br/>\r\n            \"Keep viewers informed\" meens staying up to date as the media changes.<br/> \r\n           &amp;nbspMust have a dedicated individual to do that. \r\n<p> <center><a class=\"linkBar\" href=\"#/page/index.html\">Home   <\/a>Assignments   Labs   \r\n\t<\/center><\/p>\n<p><center><span style=\"background-color: #000000\"><img alt=\"\" border=\"0\" height=\"34\" loading=\"lazy\" src=\"../assets/web-one/images/mainNav/mainNavB.bmp\" width=\"650\"/> <\/span><\/center>\n<\/p><\/p><\/p><\/p><\/p><\/font><\/td>\n<\/tr>\n<\/table>\n<!--<TD ALIGN=\"Right\">\r\n\t<TABLE BORDER=0 CELLPADDING=4 CELLSPACING=4 WIDTH=\"50%\">\r\n   \t<TR VALIGN=\"Center\"> \r\n\t<TD ALIGN=\"center\"><FONT SIZE=\"4\" FACE=\"Arial\">\r\n\t<img src=\"../images/sideBars/sideBarR.bmp\"BORDER=0 WIDTH=\"148\" HEIGHT=\"300\" ALT=\"\"><\/A>\t\t\r\n\r\n\t<\/TD>\r\n\t<\/TR>\r\n\t<\/TABLE>-->\n<\/td>\n<\/td><\/tr>\n<\/table>\n<\/center><\/div><\/body>"}, "Assignments/pageNotes.html": {"title": "Design notes", "html": "<body bgcolor=\"#000000\" onload=\"MM_preloadImages('../images/proposal/navProposal.gif','../images/proposal/navPageNotes.gif','../images/proposal/navGeneralInfo.gif','../images/proposal/navContactMe.gif','../images/proposal/navMainPage.gif')\" text=\"#1e90ff\">\n<!-- -->\n<!-- -->\n<basefont size=\"2\"/>\n<div align=\"center\">\n<!--Header-->\n<h1 align=\"center\"><p>Class 152-101 Home/L3A1 Site Spec <\/p><\/h1>\n<!--EndHeader-->\n<center>\n<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"821\">\n<tr valign=\"Middle\">\n<td><img alt=\"NavBar Proposal\" border=\"0\" height=\"46\" id=\"navbar_home\" loading=\"lazy\" name=\"navbar_proposal\" src=\"../assets/web-one/images/proposal/navProposal_nu.GIF\" width=\"113\"/><\/td>\n<td><img alt=\"NavBar Page Notes\" border=\"0\" height=\"46\" id=\"navbar_ourvision\" loading=\"lazy\" name=\"navbar_pageNotes\" src=\"../assets/web-one/images/proposal/navPageNotes_nu.GIF\" width=\"198\"/><\/td>\n<td><img alt=\"NavBar General Info\" border=\"0\" height=\"46\" id=\"navbar_aboutus\" loading=\"lazy\" name=\"navbar_generalInfo\" src=\"../assets/web-one/images/proposal/navGeneralInfo_nu.GIF\" width=\"198\"/><\/td>\n<td><img alt=\"NavBar Contact Me\" border=\"0\" height=\"46\" id=\"navbar_artworktransfer\" loading=\"lazy\" name=\"navbar_contactMe\" src=\"../assets/web-one/images/proposal/navContactMe_nu.GIF\" width=\"183\"/><\/td>\n<td><img alt=\"NavBar Main Page\" border=\"0\" height=\"46\" id=\"navbar_contactus\" loading=\"lazy\" name=\"navbar_mainPage\" src=\"../assets/web-one/images/proposal/navMainPage_nu.GIF\" width=\"146\"/><\/td>\n<\/tr><\/table>\n<table border=\"0\" cellpadding=\"2\" cellspacing=\"2\" width=\"890\">\n<tr valign=\"Top\">\n<td align=\"Left\">\n<table border=\"0\" cellpadding=\"4\" cellspacing=\"4\" width=\"50%\">\n<tr valign=\"Center\">\n<td align=\"center\"><font face=\"Arial\" size=\"4\">\n<img alt=\"\" border=\"0\" height=\"426\" loading=\"lazy\" src=\"../assets/web-one/images/sideBars/me4.bmp\" width=\"208\"/>\n<\/font><\/td>\n<\/tr>\n<\/table>\n<td align=\"Center\">\n<table border=\"0\" cellpadding=\"4\" cellspacing=\"4\" width=\"100%\">\n<tr valign=\"Center\">\n<td align=\"Left\"><font face=\"Arial\" size=\"2\">\n<center><img alt=\"\" border=\"0\" height=\"34\" loading=\"lazy\" src=\"../assets/web-one/images/mainNav/mainNavT.bmp\" width=\"650\"/><\/center><br/>\r\nThis page started out as three nested tables with a little picture in the middle at the beginning of fall semester 2007 at WITC New Richmond.\r\nI have throughout the semester tryed jscrip scroll boxes as part of this page design, though it didn't work out I  aquired a little practice in jscript.<br/><br/>\r\nI have also during this semester used CSS to change the color of my scroll bars, links and intend to futher my knowledge in CSS.<br/><br/>\r\n\r\nI went on a venture with xml files and active controls for about two days strait trying to figure out how I can load data into a table from an xml file.\r\nOne of the recources I found in this venture that helped a lot, ImportXml<br/><br/>\r\n\r\nThe picture I used for my LOGO was taken fall of 2007. I was dressed up in an attempt of self reflection to see how those around me acted differently.<br/>\n<p> <center><a class=\"linkBar\" href=\"#/page/index.html\">Home   <\/a>Assignments   Labs   \r\n\t<\/center><\/p>\n<p><center><span style=\"background-color: #000000\"><img alt=\"\" border=\"0\" height=\"34\" loading=\"lazy\" src=\"../assets/web-one/images/mainNav/mainNavB.bmp\" width=\"650\"/> <\/span><\/center>\n<\/p><\/font><\/td>\n<\/tr>\n<\/table>\n<!--<TD ALIGN=\"Right\">\r\n\t<TABLE BORDER=0 CELLPADDING=4 CELLSPACING=4 WIDTH=\"50%\">\r\n   \t<TR VALIGN=\"Center\"> \r\n\t<TD ALIGN=\"center\"><FONT SIZE=\"4\" FACE=\"Arial\">\r\n\t<img src=\"../images/sideBars/sideBarR.bmp\"BORDER=0 WIDTH=\"148\" HEIGHT=\"300\" ALT=\"\"><\/A>\t\t\r\n\r\n\t<\/TD>\r\n\t<\/TR>\r\n\t<\/TABLE>-->\n<\/td>\n<\/td><\/tr>\n<\/table>\n<\/center><\/div><\/body>"}, "Assignments/outline.html": {"title": "Site map", "html": "<body bgcolor=\"#000000\" onload=\"MM_preloadImages('../images/proposal/navProposal.gif','../images/proposal/navPageNotes.gif','../images/proposal/navGeneralInfo.gif','../images/proposal/navContactMe.gif','../images/proposal/navMainPage.gif')\" text=\"#1e90ff\">\n<!-- -->\n<!-- -->\n<basefont size=\"2\"/>\n<div align=\"center\">\n<!--Header-->\n<h1 align=\"center\"><p>L3A2 Flow Chart for This Site <\/p><\/h1>\n<!--EndHeader-->\n<center>\n<table border=\"0\" cellpadding=\"0\" cellspacing=\"0\" width=\"821\">\n<tr valign=\"Middle\">\n<td><a href=\"#/page/Assignments/proposal.html\"><img alt=\"NavBar Proposal\" border=\"0\" height=\"46\" id=\"navbar_home\" loading=\"lazy\" name=\"navbar_proposal\" src=\"../assets/web-one/images/proposal/navProposal_nu.GIF\" width=\"113\"/><\/a><\/td>\n<td><a href=\"#/page/Assignments/pageNotes.html\"><img alt=\"NavBar Page Notes\" border=\"0\" height=\"46\" id=\"navbar_ourvision\" loading=\"lazy\" name=\"navbar_pageNotes\" src=\"../assets/web-one/images/proposal/navPageNotes_nu.GIF\" width=\"198\"/><\/a><\/td>\n<td><img alt=\"NavBar General Info\" border=\"0\" height=\"46\" id=\"navbar_aboutus\" loading=\"lazy\" name=\"navbar_generalInfo\" src=\"../assets/web-one/images/proposal/navGeneralInfo_nu.GIF\" width=\"198\"/><\/td>\n<td><img alt=\"NavBar Contact Me\" border=\"0\" height=\"46\" id=\"navbar_artworktransfer\" loading=\"lazy\" name=\"navbar_contactMe\" src=\"../assets/web-one/images/proposal/navContactMe_nu.GIF\" width=\"183\"/><\/td>\n<td><img alt=\"NavBar Main Page\" border=\"0\" height=\"46\" id=\"navbar_contactus\" loading=\"lazy\" name=\"navbar_mainPage\" src=\"../assets/web-one/images/proposal/navMainPage_nu.GIF\" width=\"146\"/><\/td>\n<\/tr><\/table>\n<table border=\"0\" cellpadding=\"2\" cellspacing=\"2\" width=\"890\">\n<tr valign=\"Top\">\n<td align=\"Left\">\n<table border=\"0\" cellpadding=\"4\" cellspacing=\"4\" width=\"230\">\n<tr valign=\"TOP\">\n<td align=\"left\"><font face=\"Arial\" size=\"2\"><br/><br/>\r\n\t\tI Chose This Structure Because:<br/><br/>\r\n\t\tIt allows me fairly seemless <br/>\r\n\t\tnavigation between my pages.<br/><br/>\r\n\t\tIt is simple to understand<br/>\r\n\t\tand easy to portray for me.<br/><br/>\r\n\t\tThis flow chart should show<br/>\r\n\t\tthat you can access all the main<br/>\r\n\t\tcontents, home or contact from <br/>\r\n\t\tany where. Also shows you can't<br/>\r\n\t\taccess a lab from an assignment.<br/>\r\n\t\tOr Vice Versa<br/><br/>\r\n\t\tThis site meets all requirments of <br/>\r\n\t\tL3A2. This page is extra.<br/>\n<!--<img src=\"../images/sideBars/me4.bmp\"BORDER=0 WIDTH=\"208\" HEIGHT=\"426\" ALT=\"\"><\/A>-->\n<\/font><\/td>\n<\/tr>\n<\/table>\n<td align=\"Center\">\n<table border=\"0\" cellpadding=\"4\" cellspacing=\"4\" width=\"100%\">\n<tr valign=\"Center\">\n<td align=\"Left\"><font face=\"Arial\" size=\"2\">\n<center><img alt=\"\" border=\"0\" height=\"34\" loading=\"lazy\" src=\"..
